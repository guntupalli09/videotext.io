<svg width="1400" height="787" viewBox="0 0 1400 787" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020817;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#060D24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#030C1E;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#38BDF8;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#0EA5E9;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="delivered-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0EA5E9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38BDF8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="competitor-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1E293B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#334155;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F8FAFC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#CBD5E1;stop-opacity:1" />
    </linearGradient>
    <filter id="blueglow">
      <feGaussianBlur stdDeviation="16" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="bgBlur">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="1400" height="787" fill="url(#bg)"/>

  <!-- Ambient light orbs -->
  <circle cx="200" cy="200" r="300" fill="#0EA5E9" opacity="0.04" filter="url(#bgBlur)"/>
  <circle cx="1200" cy="580" r="280" fill="#6366F1" opacity="0.05" filter="url(#bgBlur)"/>
  <circle cx="700" cy="400" r="400" fill="#0284C7" opacity="0.03" filter="url(#bgBlur)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="131" x2="1400" y2="131" stroke="#0F172A" stroke-width="1"/>
  <line x1="0" y1="262" x2="1400" y2="262" stroke="#0F172A" stroke-width="1"/>
  <line x1="0" y1="393" x2="1400" y2="393" stroke="#0F172A" stroke-width="1"/>
  <line x1="0" y1="524" x2="1400" y2="524" stroke="#0F172A" stroke-width="1"/>
  <line x1="0" y1="655" x2="1400" y2="655" stroke="#0F172A" stroke-width="1"/>
  <line x1="233" y1="0" x2="233" y2="787" stroke="#0F172A" stroke-width="1"/>
  <line x1="466" y1="0" x2="466" y2="787" stroke="#0F172A" stroke-width="1"/>
  <line x1="700" y1="0" x2="700" y2="787" stroke="#0F172A" stroke-width="1"/>
  <line x1="933" y1="0" x2="933" y2="787" stroke="#0F172A" stroke-width="1"/>
  <line x1="1166" y1="0" x2="1166" y2="787" stroke="#0F172A" stroke-width="1"/>

  <!-- Top tag -->
  <rect x="560" y="50" width="280" height="34" rx="17" fill="#0C1A2E" stroke="#1E3A5F" stroke-width="1"/>
  <text x="700" y="72" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="2.5" fill="#38BDF8">CAPTION DELIVERY WORKFLOW</text>

  <!-- Main headline - line 1 -->
  <text x="700" y="200" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="900" letter-spacing="-2" fill="url(#textGlow)">Client-ready subtitles</text>

  <!-- Glowing accent line -->
  <rect x="300" y="216" width="800" height="3" fill="url(#blueGlow)" rx="2"/>

  <!-- Main headline - line 2 -->
  <text x="700" y="285" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="400" fill="#64748B" letter-spacing="-1">before competitors</text>

  <!-- Main headline - line 3 - glowing blue -->
  <text x="700" y="365" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="900" letter-spacing="-2" fill="#38BDF8" filter="url(#softglow)">finish uploading.</text>

  <!-- ——— Workflow Race Visual ——— -->

  <!-- Timeline labels -->
  <text x="110" y="445" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#475569">YOU</text>
  <text x="110" y="510" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#334155">COMPETITOR</text>

  <!-- Time axis marks -->
  <text x="230" y="540" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#1E293B">0</text>
  <text x="530" y="540" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#1E293B">30 min</text>
  <text x="830" y="540" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#1E293B">60 min</text>
  <text x="1130" y="540" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" fill="#1E293B">90 min</text>

  <!-- Track background - YOU -->
  <rect x="160" y="420" width="1180" height="38" rx="6" fill="#0C1A2E" opacity="0.6"/>
  <!-- Progress bar - YOU (90 min delivery on a 140 min scale = ~900px wide for full) -->
  <rect x="160" y="420" width="750" height="38" rx="6" fill="url(#delivered-bar)" opacity="0.9"/>

  <!-- Delivered badge -->
  <rect x="880" y="425" width="150" height="28" rx="14" fill="#0284C7" stroke="#38BDF8" stroke-width="1"/>
  <text x="955" y="444" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#F0F9FF">✓ DELIVERED</text>

  <!-- Track background - COMPETITOR -->
  <rect x="160" y="476" width="1180" height="38" rx="6" fill="#0C1015" opacity="0.6"/>
  <!-- Progress bar - COMPETITOR (still in progress at same time = 60% done) -->
  <rect x="160" y="476" width="430" height="38" rx="6" fill="url(#competitor-bar)" opacity="0.7"/>

  <!-- Still formatting label -->
  <text x="620" y="500" text-anchor="start" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="500" fill="#475569">still formatting…</text>

  <!-- Timeline tick marks -->
  <line x1="230" y1="415" x2="230" y2="525" stroke="#1E293B" stroke-width="1"/>
  <line x1="530" y1="415" x2="530" y2="525" stroke="#1E293B" stroke-width="1"/>
  <line x1="830" y1="415" x2="830" y2="525" stroke="#1E293B" stroke-width="1"/>
  <line x1="1130" y1="415" x2="1130" y2="525" stroke="#1E293B" stroke-width="1"/>

  <!-- Key stat pill -->
  <rect x="480" y="570" width="440" height="60" rx="12" fill="#0C1A2E" stroke="#1E3A5F" stroke-width="1.5"/>
  <rect x="480" y="570" width="440" height="60" rx="12" fill="none" stroke="#0EA5E9" stroke-width="1" opacity="0.3"/>
  <text x="700" y="597" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" fill="#64748B" letter-spacing="1">2-hour video</text>
  <text x="700" y="619" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" fill="#38BDF8" letter-spacing="-0.5">transcript in 4 min  ·  delivered in 90 min</text>

  <!-- Divider -->
  <line x1="200" y1="668" x2="1200" y2="668" stroke="#0F172A" stroke-width="1"/>

  <!-- Bottom text -->
  <text x="700" y="706" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#334155" letter-spacing="0.5">QA + formatting + export in one pass</text>

  <!-- Bottom branding -->
  <text x="700" y="752" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#1E3A5F">VIDEOTEXT.IO</text>
</svg>
