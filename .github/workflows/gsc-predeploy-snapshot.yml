# Pre-deploy GSC baseline: 28-day page metrics for touched pages.
# Run manually before merging SEO/deploy PRs — data cannot be reconstructed later.
name: GSC Predeploy Snapshot

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to commit snapshot CSVs to'
        required: false
        default: 'main'
  push:
    branches: [main]
    paths:
      - '.github/workflows/gsc-predeploy-snapshot.yml'
      - 'scripts/seo/snapshot-gsc-predeploy.ts'
      - 'scripts/seo/gsc-predeploy-pages.txt'

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root deps
        run: npm install

      - name: Fetch 28-day GSC page metrics
        run: npm run seo:gsc-predeploy
        env:
          GSC_CLIENT_EMAIL: ${{ secrets.GSC_CLIENT_EMAIL }}
          GSC_PRIVATE_KEY: ${{ secrets.GSC_PRIVATE_KEY }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}

      - name: Upload GSC snapshot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gsc-predeploy-snapshot
          path: |
            reports/gsc-predeploy-*.csv
            scripts/seo/data/gsc-predeploy-*.json

      - name: Commit snapshot to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/gsc-predeploy-*.csv scripts/seo/data/gsc-predeploy-*.json
          if git diff --staged --quiet; then
            echo "No new snapshot files to commit."
            exit 0
          fi
          git commit -m "chore(seo): GSC pre-deploy baseline snapshot (28 days, touched pages)"
          git push
