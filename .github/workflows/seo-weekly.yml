# Weekly SEO pipeline: collect trends, run decision engine, produce proposals, open PR (human-in-the-loop).
name: SEO Weekly

on:
  schedule:
    - cron: '0 0 * * 1'  # Monday 00:00 UTC
  workflow_dispatch:

jobs:
  seo-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root deps
        run: npm install

      # 🔥 STEP 1 — Fetch GSC data (API-based)
      - name: Fetch Google Search Console data
        run: npm run seo:fetch
        env:
          GSC_CLIENT_EMAIL: ${{ secrets.GSC_CLIENT_EMAIL }}
          GSC_PRIVATE_KEY: ${{ secrets.GSC_PRIVATE_KEY }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}

      # 🔥 STEP 2 — Run SEO weekly discovery (SERP + proposals)
      - name: Run SEO weekly job
        run: npm run seo:weekly
        env:
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}

      # 🔥 STEP 3 — Run KPI monitor (uses fetched GSC data)
      - name: Run SEO KPI monitor
        run: npm run seo:kpi

      - name: Run SEO verify
        run: npm run seo:verify

      - name: Upload seo output artifact
        uses: actions/upload-artifact@v4
        with:
          name: seo-output
          path: |
            scripts/seo/output/seo-proposals.json
            scripts/seo/output/changelog.md
            scripts/seo/output/seo-kpi-actions.json
            scripts/seo/output/seo-kpi-report.md

  # Open PR with proposals, changelog, and sitemap refresh (human-in-the-loop).
  open-pr:
    needs: seo-pipeline
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root deps
        run: npm install

      - name: Download seo output
        uses: actions/download-artifact@v4
        with:
          name: seo-output
          path: scripts/seo/output

      - name: Apply proposals to registry (CREATE_NEW_PAGE only)
        run: npm run seo:apply-proposals

      - name: Sync routes from registry
        run: npm run seo:sync

      - name: Validate registry
        run: npm run seo:validate-registry

      - name: Regenerate changelog (from proposals)
        run: npm run seo:changelog

      - name: Generate sitemap
        run: npm run seo:sitemap
        env:
          SITE_URL: https://videotext.io

      - name: Validate sitemap
        run: npm run seo:validate-sitemap
        env:
          SITE_URL: https://videotext.io

      - name: Create SEO branch and PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: seo/weekly-proposals
          delete-branch: true
          title: 'SEO Weekly: proposals, KPI insights, registry edits, and sitemap'
          body: |
            ## SEO Weekly Run
            - **Proposals:** `scripts/seo/output/seo-proposals.json`
            - **Changelog:** `scripts/seo/output/changelog.md`
            - **KPI Actions:** `scripts/seo/output/seo-kpi-actions.json`
            - **KPI Report:** `scripts/seo/output/seo-kpi-report.md`
            - **Registry:** Patched for CREATE_NEW_PAGE proposals (if any).
            - **Sitemap:** Regenerated from indexable routes.
            - **Guardrails:** validate-registry and validate-sitemap passed.

            ⚠️ Review before merging. Prioritize P0 KPI actions.

          commit-message: 'chore(seo): weekly proposals, KPI insights, registry edits, sitemap'