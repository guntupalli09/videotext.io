# Build and SEO smoke tests. Runs on push/PR to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root deps
        run: npm install

      - name: Build (SITE_URL + RELEASE for smoke and observability)
        run: |
          cd client
          echo 'VITE_SITE_URL=http://localhost:4173' > .env.production.local
          echo "VITE_RELEASE=${{ github.sha }}-${{ github.run_number }}" >> .env.production.local
          npm ci && npm run build && node -e "require('fs').cpSync('dist','../dist',{recursive:true})"

      - name: Prerender smoke routes (production canonicals)
        run: npx tsx scripts/prerender.ts
        env:
          PRERENDER_ONLY: /,/pricing,/faq,/video-to-transcript,/video-to-subtitles,/translate-subtitles,/fix-subtitles,/burn-subtitles,/compress-video,/meeting-transcription

      - name: Install serve and wait-on
        run: npm install -D serve wait-on

      - name: Serve built client (background, SPA mode for client-side routes)
        run: npx serve dist -l 4173 -s &

      - name: Wait for server
        run: npx wait-on http://localhost:4173 -t 15000

      - name: SEO smoke test (10 URLs)
        run: npm run seo:smoke
        env:
          BASE_URL: http://localhost:4173
          SITE_URL: https://videotext.io

      - name: "SEO health check (shell-mode: robots + sitemap)"
        run: npm run seo:health
        env:
          BASE_URL: http://localhost:4173
          SITE_URL: https://videotext.io
          SEO_HEALTH_MODE: shell
